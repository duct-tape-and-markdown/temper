[[declaration.kind]]
name = "handler"
unit_shape = "file"
shape = "fields"
cite = "https://code.claude.com/docs/en/hooks (retrieved 2026-09-29)"

[[declaration.kind]]
name = "hook"
locus_root = ".claude"
locus_glob = ["settings.json"]
unit_shape = "file"
registration = ["event(event)"]
templates = [{ kind = "handler" }]
shape = "fields"
collection_address = { key_path = "hooks.<Event>", entry_shape = "group-array(hooks;matcher)" }
guidance = "keep a handler's `type` among `command`/`http`/`mcp_tool`/`prompt`/`agent`; a `command` handler needs a `command`, an `http` handler a `url`; the `matcher` filters tool-scoped events and is inert on events that carry no tool (`UserPromptSubmit`, `Stop`, and their siblings)."

[[declaration.kind]]
name = "memory"
locus_root = "."
locus_glob = ["**/CLAUDE.md", "**/AGENTS.md"]
exclude = [".claude/agents", ".claude/commands", ".claude/output-styles", ".claude/skills"]
absence_gate = [{ template = "**/AGENTS.md", absent = ["CLAUDE.md", ".claude/CLAUDE.md", "CLAUDE.local.md"] }]
unit_shape = "file"
registration = ["on-read-beneath"]
guidance = "a `paths:` frontmatter block belongs on a `.claude/rules/*.md` file, not on `CLAUDE.md` — the memory docs document `paths` only for rules, so a rules-style header on `CLAUDE.md` is dead configuration. Split a large file with `@path` imports (resolved relative to the importing file, absolute allowed, recursion capped at four hops; wrap a path in backticks to mention it without importing). If the repo already ships an `AGENTS.md` for other agents, don't duplicate it — create a `CLAUDE.md` that `@AGENTS.md`-imports it (or symlink, except on Windows where the import is the recommended bridge). Mind the loading asymmetry: every ancestor `CLAUDE.md` loads in full at launch, while files in subdirectories load only when Claude reads a file there — so a rule that must always hold belongs above the working directory, not below it. Personal, un-shared notes go in `CLAUDE.local.md` (gitignored), appended after `CLAUDE.md` at its level."
ceded = [{ to = "output-style", pattern = "**/.claude/output-styles/*.md" }, { to = "rule", pattern = "**/.claude/rules/**/*.md" }, { to = "skill", pattern = "**/.claude/skills/*/**" }]

[[declaration.kind]]
name = "rule"
locus_root = "."
locus_glob = ["**/.claude/rules/**/*.md"]
exclude = ["tests/fixtures", "examples/demo"]
format = "yaml-frontmatter"
unit_shape = "file"
registration = ["paths-match(paths)"]
ceded = [{ to = "skill", pattern = "**/.claude/skills/*/**" }]

[[declaration.kind]]
name = "settings"
locus_root = ".claude"
locus_glob = ["settings.json"]
format = "json-document"
unit_shape = "file"

[[declaration.kind]]
name = "skill"
locus_root = "."
locus_glob = ["**/.claude/skills/*/SKILL.md"]
exclude = ["tests/fixtures"]
leniency = ["malformed-yaml"]
format = "yaml-frontmatter"
unit_shape = "directory"
registration = ["user-invoked", "description-trigger(description)", "paths-listing(paths)"]
templates = [{ kind = "supporting-doc", path = "*.md" }]

[[declaration.kind]]
name = "tool"
unit_shape = "file"
shape = "fields"
leaves = ["package", "bin", "file", "system"]

[[declaration.clause]]
id = "root.reachable"
predicate = "reachable"
severity = "advisory"
guidance = "This member is authored but unreachable: every registration channel its kind declares is provably dead, and no member that is reachable imports it. Claude never loads it, so it is context you maintain and never pay for — and a reader of the tree cannot tell it from live configuration. Three remedies: open a channel (give the `paths` globs a file they match, give the `description` trigger words), import it from a member that is reachable, or delete it. Advisory because a dead edge is a legitimate work-in-progress state; dial it or re-declare the clause `required` once your tree should hold the line."
cite = "https://code.claude.com/docs/en/memory#path-specific-rules (retrieved 2026-07-15); https://code.claude.com/docs/en/skills (retrieved 2026-07-16)"

[[declaration.clause]]
id = "root.fresh"
predicate = "fresh"
severity = "advisory"
guidance = "A lock row this member owns no longer matches disk: either its committed projection was hand-edited, or a fingerprinted source dependency has moved: a layout import, a prose include, a declared input, or — on the root member — a module the program itself loaded. Nothing reverse-parses a projection back into the program, so the two sides stay apart until you reconcile them: edit the owning source and re-emit, and for a moved declared input re-verify the member's claims against the new bytes first. Advisory because a drifted checkout is usually one `emit` away and blocking every such run would be temper's escalation, not yours; dial this label to `required` — or re-declare the clause — once a drifted projection should fail CI."
cite = "https://github.com/duct-tape-and-markdown/temper/blob/main/specs/model/pipeline.md#drift (retrieved 2026-11-26)"

[[declaration.clause]]
id = "root.locus-declared"
predicate = "locus-declared"
severity = "advisory"
guidance = "A document sits at a governed locus that your program declares no member for. temper maintains nothing about it: `emit` never reaps it, and where your registrations write into it, `emit` renders their entries and refuses to delete any key it does not own; `guard` never bound it, and every address under it resolves to nothing — so it reads as governed configuration while being governed by no one. Where the locus is one the harness itself loads — a built-in kind's — it is live context on top of that; where the kind is your own, who reads it is yours to know and not temper's to claim. Declare the member in the program and re-emit; for a directory whose documents are authored in place rather than projected, declare its kind `local` so `check` derives the rows at read time instead. Advisory because a tree mid-adoption legitimately carries documents the program has not reached yet; dial this label to `required` — or re-declare the clause — once every document at a governed locus should be one you declared."
cite = "https://github.com/duct-tape-and-markdown/temper/blob/main/specs/decisions/0054-the-root-member-carries-a-contract.md (retrieved 2026-11-26)"

[[declaration.clause]]
id = "root.engine-matches"
predicate = "engine-matches"
severity = "advisory"
guidance = "Your committed lock records a different temper version than the one running this gate. The rows being read were compiled by a compiler this binary is not, so every verdict below rests on a translation: an older spelling normalizes at read time, but a genuine change in what a row means reads the same from the inside. Re-run `emit` — it rewrites the lock whole in this engine's canonical form, and the stamp goes back to matching. Advisory because a lagging stamp is the ordinary state of every checkout between an upgrade and the next emit, and blocking there would make an upgrade a hard stop; dial this label to `required` — or re-declare the clause — once your CI should refuse a lock it did not compile."
cite = "https://github.com/duct-tape-and-markdown/temper/blob/main/specs/model/pipeline.md#the-lock (retrieved 2026-11-26)"

[[declaration.clause]]
id = "root.resolves"
predicate = "resolves"
severity = "required"
guidance = "A reference this member declares — a field naming another member, or a mention in its prose — names a target the tree does not hold, or a bare key several hosts carry. The runtime resolves such a field by name: a subagent's `skills` list, for one, preloads each skill it names, so a name that matches no skill delivers nothing. Fix the name, author the missing member, or spell the whole `<host-address>/<kind>/<key>` address where hosts share a key. Required because the program's own `emit` refuses the same reference; dial this label to `advisory` while a tree mid-adoption still carries one."
cite = "https://code.claude.com/docs/en/sub-agents#preload-skills-into-subagents (retrieved 2026-11-26)"

[[declaration.clause]]
id = "root.import-backed"
predicate = "import-backed"
severity = "advisory"
guidance = "This member's `@path` import names no member and no repository file. Claude Code expands an import into context beside the file that carries it, resolving a relative path against that file rather than the working directory, so a path that reaches nothing loads nothing, silently. Fix the path relative to the importing file — a trailing `.` reads as part of it — or set the text off in backticks if it was never meant as an import. Advisory because the importing file still loads; dial this label to `required` — or re-declare the clause — once a dead import should fail CI."
cite = "https://code.claude.com/docs/en/memory#import-additional-files (retrieved 2026-11-26)"

[[declaration.clause]]
id = "root.listing.description+when_to_use"
predicate = "listing"
field = "description+when_to_use"
severity = "advisory"
guidance = "Every model-invocable skill's and command's `description` and `when_to_use` ride every request in one listing, under a character budget that scales at 1% of the context window, with a fallback of 8,000 characters — the figure this clause judges. Each entry counts up to the 1,536-character cap the listing cuts it at. Over the budget, Claude Code keeps every name but drops descriptions starting with the ones you invoke least, so those skills and commands lose the keywords Claude matches a request against. One with `disable-model-invocation: true` is not listed and is not counted. Trim descriptions to the key use case first, set rarely-used ones to `disable-model-invocation: true` or to `name-only` in `skillOverrides`, or raise the budget with `skillListingBudgetFraction` (or `SLASH_COMMAND_TOOL_CHAR_BUDGET`) and retune this clause's bound to match. Counted over this harness's own skills and commands only: plugin, bundled and personal skills share the same listing, so the real headroom is smaller."
cite = "https://code.claude.com/docs/en/skills#skill-descriptions-are-cut-short; https://code.claude.com/docs/en/env-vars (SLASH_COMMAND_TOOL_CHAR_BUDGET); https://code.claude.com/docs/en/settings-reference#skilllistingmaxdescchars (retrieved 2026-11-26)"
fields = ["description", "when_to_use"]
gate = "disable-model-invocation"
bound = { max = 8000, entry = 1536 }
values = ["skill", "command"]

[[declaration.requirement]]
name = "context-arrives"
required = false
verifier = { species = "telemetry", events = ["InstructionsLoaded", "SkillInvoked"] }
prose = "every always-on member this harness declares should actually reach the model, and every skill should be reachable by its description — the failure intent.md names (a rule that fails to load, a skill that never triggers), judged by reading the field record, never by check"

[[declaration.requirement]]
