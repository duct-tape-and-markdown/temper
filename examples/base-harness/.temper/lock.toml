[[declaration.kind]]
name = "glossary"
locus_root = "docs"
locus_glob = ["glossary.md"]
unit_shape = "file"
registration = ["always"]
content = { regions = [{ region = "prose" }, { region = "collection", member_kind = "term" }] }

[[declaration.kind]]
name = "handler"
unit_shape = "file"
shape = "fields"
cite = "https://code.claude.com/docs/en/hooks (retrieved 2026-09-29)"

[[declaration.kind]]
name = "hook"
locus_root = ".claude"
locus_glob = ["settings.json"]
unit_shape = "file"
registration = ["event(event)"]
templates = [{ kind = "handler" }]
shape = "fields"
collection_address = { key_path = "hooks.<Event>", entry_shape = "group-array(hooks;matcher)" }
guidance = "keep a handler's `type` among `command`/`http`/`mcp_tool`/`prompt`/`agent`; a `command` handler needs a `command`, an `http` handler a `url`; the `matcher` filters tool-scoped events and is inert on events that carry no tool (`UserPromptSubmit`, `Stop`, and their siblings)."

[[declaration.kind]]
name = "memory"
locus_root = "."
locus_glob = ["**/CLAUDE.md", "**/AGENTS.md"]
exclude = [".claude/agents", ".claude/commands", ".claude/output-styles", ".claude/skills"]
absence_gate = [{ template = "**/AGENTS.md", absent = ["CLAUDE.md", ".claude/CLAUDE.md", "CLAUDE.local.md"] }]
unit_shape = "file"
registration = ["on-read-beneath"]
guidance = "a `paths:` frontmatter block belongs on a `.claude/rules/*.md` file, not on `CLAUDE.md` — the memory docs document `paths` only for rules, so a rules-style header on `CLAUDE.md` is dead configuration. Split a large file with `@path` imports (resolved relative to the importing file, absolute allowed, recursion capped at four hops; wrap a path in backticks to mention it without importing). If the repo already ships an `AGENTS.md` for other agents, don't duplicate it — create a `CLAUDE.md` that `@AGENTS.md`-imports it (or symlink, except on Windows where the import is the recommended bridge). Mind the loading asymmetry: every ancestor `CLAUDE.md` loads in full at launch, while files in subdirectories load only when Claude reads a file there — so a rule that must always hold belongs above the working directory, not below it. Personal, un-shared notes go in `CLAUDE.local.md` (gitignored), appended after `CLAUDE.md` at its level."
ceded = [{ to = "output-style", pattern = "**/.claude/output-styles/*.md" }, { to = "rule", pattern = "**/.claude/rules/**/*.md" }, { to = "skill", pattern = "**/.claude/skills/*/**" }]

[[declaration.kind]]
name = "rule"
locus_root = "."
locus_glob = ["**/.claude/rules/**/*.md"]
format = "yaml-frontmatter"
unit_shape = "file"
registration = ["paths-match(paths)", "on-read-beneath"]
guidance = "a rule reaches context on one of two schedules: with no `paths` frontmatter it loads at launch, beside `CLAUDE.md`; with `paths` it loads the first time Read, Write or Edit touches a matching file, once per session. A subdirectory's own `.claude/rules/` loads with that subdirectory's `CLAUDE.md`, the first time Claude reads a file beneath it. So keep a rule to facts Claude should hold whenever the rule is loaded — concrete enough to verify ('use 2-space indentation', not 'format code properly'). If an entry is a multi-step procedure or only matters occasionally, it belongs in a skill, whose body loads only when invoked, rather than a rule, which loads whole once its scope opens. Prefer path-scoped rules when one convention governs scattered paths; prefer per-directory CLAUDE.md when directory owners maintain their own. Treat rules like code: prune them when behavior drifts, and test a change by watching whether Claude's behavior actually shifts."
cite = "https://code.claude.com/docs/en/memory (retrieved 2026-11-25); path-rule load timing observed on Claude Code 2.1.332"
ceded = [{ to = "skill", pattern = "**/.claude/skills/*/**" }]

[[declaration.kind]]
name = "settings"
locus_root = ".claude"
locus_glob = ["settings.json"]
format = "json-document"
unit_shape = "file"

[[declaration.kind]]
name = "skill"
locus_root = "."
locus_glob = ["**/.claude/skills/*/SKILL.md"]
leniency = ["malformed-yaml"]
format = "yaml-frontmatter"
unit_shape = "directory"
registration = ["user-invoked", "description-trigger(description)", "paths-listing(paths)"]
templates = [{ kind = "supporting-doc", path = "*.md" }]
guidance = "a skill reaches context in two steps: its `description` is listed from session start, and its body loads only when the skill is invoked — by `/name`, or by Claude matching the description — so the description carries the trigger and the body the procedure. A `paths` list withholds even the listing until Read, Write or Edit touches a matching file, and supporting files load only when the body sends Claude to one. Set `disable-model-invocation: true` for side-effectful workflows you want to time yourself — it drops the description from context too, so only `/name` loads the skill; `user-invocable: false` for background knowledge that is not a command. Prefer gerund or noun-phrase names (`processing-pdfs`, `pdf-processing`) over vague ones (`helper`, `utils`); `metadata` is the sanctioned home for versioning — there is no top-level `version` field."
cite = "https://code.claude.com/docs/en/skills (retrieved 2026-11-25)"

[[declaration.kind]]
name = "superseded-decision"
locus_root = "docs/decisions/superseded"
locus_glob = ["*.md"]
format = "yaml-frontmatter"
unit_shape = "file"
registration = ["always"]

[[declaration.kind]]
name = "supporting-doc"
unit_shape = "file"
guidance = "a supporting doc never loads on its own: it reaches context only when its skill's body sends Claude to it, after the skill is invoked — so the body names the file and says when to open it, and a doc the body never mentions is never read. Keep each doc to one concern, so following one pointer loads only what that step needs."
cite = "https://code.claude.com/docs/en/skills (retrieved 2026-11-25)"

[[declaration.kind]]
name = "system"
locus_root = "docs/systems"
locus_glob = ["*.md"]
unit_shape = "file"
registration = ["always"]
templates = [{ kind = "invariant" }]

[[declaration.kind]]
name = "tool"
unit_shape = "file"
shape = "fields"
leaves = ["package", "bin", "file", "system"]

[[declaration.clause]]
id = "decision.unique-name"
kind = "decision"
predicate = "unique-name"
severity = "required"

[[declaration.clause]]
id = "flow.unique-name"
kind = "flow"
predicate = "unique-name"
severity = "required"

[[declaration.clause]]
id = "skill.required.name"
kind = "skill"
predicate = "required"
field = "name"
severity = "required"
guidance = "Every skill declares a `name` — the slug the harness binds to. Claude Code alone would default it from the directory name, but a nameless skill is not portable: the spec and Anthropic's upload validation both require it."
cite = "https://agentskills.io/specification#frontmatter (retrieved 2026-07-15)"

[[declaration.clause]]
id = "skill.min-len.name"
kind = "skill"
predicate = "min-len"
field = "name"
severity = "required"
guidance = "A present-but-empty name fails the spec's 1-64 character bound."
cite = "https://agentskills.io/specification#name-field (retrieved 2026-07-15)"
bound = { min = 1 }

[[declaration.clause]]
id = "skill.allowed-chars.name"
kind = "skill"
predicate = "allowed-chars"
field = "name"
severity = "required"
guidance = "Lowercase letters, digits, and hyphens only — `PDF-Processing` is the spec's own counter-example. The charset also keeps XML out of the name, which Anthropic's upload validation separately forbids."
