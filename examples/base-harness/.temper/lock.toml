[[declaration.clause]]
label = "decision.unique-name"
kind = "decision"
predicate = "unique-name"
severity = "required"

[[declaration.clause]]
label = "flow.unique-name"
kind = "flow"
predicate = "unique-name"
severity = "required"

[[declaration.clause]]
label = "skill.required.name"
kind = "skill"
predicate = "required"
field = "name"
severity = "required"
guidance = "Every skill declares a `name` — the slug the harness binds to. Claude Code alone would default it from the directory name, but a nameless skill is not portable: the spec and Anthropic's upload validation both require it."
cite = "https://agentskills.io/specification#frontmatter (retrieved 2026-07-15)"

[[declaration.clause]]
label = "skill.min_len.name"
kind = "skill"
predicate = "min_len"
field = "name"
severity = "required"
guidance = "A present-but-empty name fails the spec's 1-64 character bound."
cite = "https://agentskills.io/specification#name-field (retrieved 2026-07-15)"
bound = { min = 1 }

[[declaration.clause]]
label = "skill.allowed_chars.name"
kind = "skill"
predicate = "allowed_chars"
field = "name"
severity = "required"
guidance = "Lowercase letters, digits, and hyphens only — `PDF-Processing` is the spec's own counter-example. The charset also keeps XML out of the name, which Anthropic's upload validation separately forbids."
cite = "https://agentskills.io/specification#name-field (retrieved 2026-07-15)"
charset = { ranges = ["a-z", "0-9"], chars = "-" }

[[declaration.clause]]
label = "skill.max_len.name"
kind = "skill"
predicate = "max_len"
field = "name"
severity = "required"
guidance = "Keep the name short and slug-like; it becomes a directory and an id."
cite = "https://agentskills.io/specification#name-field (retrieved 2026-07-15)"
bound = { max = 64 }

[[declaration.clause]]
label = "skill.shape.name"
kind = "skill"
predicate = "shape"
field = "name"
severity = "required"
guidance = "A hyphen separates segments, so it may not lead, trail, or double — `-pdf`, `pdf-`, and `pdf--processing` are the spec's own counter-examples. The charset clause above admits the hyphen; this places it."
cite = "https://agentskills.io/specification#name-field (retrieved 2026-07-17)"
shape = "hyphen-placement"

[[declaration.clause]]
label = "skill.deny.name"
kind = "skill"
predicate = "deny"
field = "name"
severity = "required"
guidance = "Reserved words, enforced by Anthropic's platform upload validation (not by the open spec, and not by Claude Code's runtime — which itself ships a `claude-api` skill). Keep them out if the skill will ever travel through the API or claude.ai."
cite = "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/overview#skill-structure (retrieved 2026-07-15)"
values = ["anthropic", "claude"]

[[declaration.clause]]
label = "skill.name-matches-dir"
kind = "skill"
predicate = "name-matches-dir"
severity = "required"
guidance = "The spec requires the name to match its parent directory. Claude Code decouples the two (the frontmatter name is a display label; the directory names the slash command, except for a plugin-root SKILL.md) — but a mismatch is a portability trap and a reader trap even where it loads."
cite = "https://agentskills.io/specification#name-field (retrieved 2026-07-15)"

[[declaration.clause]]
label = "skill.required.description"
kind = "skill"
predicate = "required"
field = "description"
severity = "required"
guidance = "The description is how the model chooses this skill from potentially 100+ available — it is the skill's API. Claude Code would fall back to the body's first paragraph; the spec and upload validation require it declared."
cite = "https://agentskills.io/specification#frontmatter (retrieved 2026-07-15)"

[[declaration.clause]]
label = "skill.min_len.description"
kind = "skill"
predicate = "min_len"
field = "description"
severity = "required"
guidance = "Say both what the skill does and when to use it, with the keywords a user would naturally say. Write in third person — the text is injected into the system prompt, and inconsistent point-of-view causes discovery problems."
cite = "https://agentskills.io/specification#description-field (retrieved 2026-07-15)"
bound = { min = 1 }

[[declaration.clause]]
label = "skill.max_len.description"
kind = "skill"
predicate = "max_len"
field = "description"
severity = "required"
guidance = "The spec's cap. Claude Code additionally truncates the skill listing at 1,536 combined characters (description + when_to_use) — truncation, not rejection, but text past the fold cannot help the model choose."
cite = "https://agentskills.io/specification#description-field (retrieved 2026-07-15)"
bound = { max = 1024 }

[[declaration.clause]]
label = "skill.shape.description"
kind = "skill"
predicate = "shape"
field = "description"
severity = "required"
guidance = "Anthropic's platform upload validation rejects a description carrying an XML tag — the description is injected into the system prompt, where a tag is markup rather than text. Neither the open spec nor Claude Code's runtime enforces it, so this is the clause that keeps a skill portable through the API and claude.ai. Prose spelling a comparison (`use when x < y`) is not a tag and does not fire."
cite = "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/overview#skill-structure (retrieved 2026-07-17)"
shape = "no-xml-tags"

[[declaration.clause]]
label = "skill.max_len.compatibility"
kind = "skill"
predicate = "max_len"
field = "compatibility"
severity = "required"
guidance = "Optional field; when present the spec caps it at 500 characters. Most skills do not need it."
cite = "https://agentskills.io/specification#frontmatter (retrieved 2026-07-15)"
bound = { max = 500 }

[[declaration.clause]]
label = "skill.extent"
kind = "skill"
predicate = "extent"
severity = "advisory"
guidance = "Progressive disclosure: keep SKILL.md under 500 rendered lines and move detailed reference material to separate files, one level deep. Measured render-side — the lines the projected artifact contributes to context, not the source body before any include resolves. Once a skill loads, its body stays in context across turns — every line is a recurring token cost. The context window is a public good."
cite = "https://agentskills.io/specification#progressive-disclosure (retrieved 2026-07-15)"
bound = { max = 500 }
unit = "lines"

[[declaration.clause]]
label = "skill.forbidden_keys"
kind = "skill"
predicate = "forbidden_keys"
severity = "required"
guidance = "Cursor `.mdc` keys. Nothing in the Agent Skills spec or Claude Code's documented frontmatter accepts them — a skill authored with them is carrying dead configuration that another tool's semantics silently fail to apply."
cite = "https://agentskills.io/specification#frontmatter (retrieved 2026-07-15)"
keys = ["globs", "alwaysApply"]

[[declaration.clause]]
label = "skill.glob-valid.paths"
kind = "skill"
predicate = "glob-valid"
field = "paths"
severity = "required"
guidance = "The optional `paths` scope gates every invocation channel until Claude reads a file its globs match; each entry is a glob (brace expansion supported). An unparseable pattern — an unclosed `[`, say — is invalid under globset and silently matches nothing, so the gate never opens and the skill never registers, with no error surfaced. Fix the pattern or drop the field."
cite = "https://code.claude.com/docs/en/memory#path-specific-rules (retrieved 2026-07-15)"

[[declaration.clause]]
label = "skill.mention-reachable.paths"
kind = "skill"
predicate = "mention-reachable"
field = "paths"
severity = "advisory"
guidance = "A mention of a gated member is actionable only where that member can be invoked. A `paths` gate removes its member from every invocation channel until Claude reads a matching file, and invoking a gated member from outside its gate hard-errors (`Unknown skill`) — the harness then tells the user it doesn't exist. So a skill that loads where its target cannot be invoked hands Claude an obligation it cannot act on. Two remedies: scope this skill's `paths` to the target's gate, or ungate the target. Advisory because the containment test is literal — every glob here must appear verbatim in the gate — so a semantically narrower glob (`src/**/*.ts` inside `src/**`) false-fires; retune or drop this clause in your own contract when it does."
cite = "https://code.claude.com/docs/en/skills (retrieved 2026-07-16; gating hard-error verified against 2.1.211)"
gate = "paths"

[[declaration.clause]]
label = "system.unique-name"
kind = "system"
predicate = "unique-name"
severity = "required"

[[declaration.clause]]
label = "system.extent"
kind = "system"
predicate = "extent"
severity = "advisory"
guidance = "a system doc is navigational, not exhaustive — past ~120 rendered lines, promote a section to a flow or split the system. Measured render-side, off the projected artifact rather than the source body."
bound = { max = 120 }
unit = "lines"

[[declaration.clause]]
label = "root.reachable"
predicate = "reachable"
severity = "advisory"
guidance = "This member is authored but unreachable: every registration channel its kind declares is provably dead, and no member that is reachable imports it. Claude never loads it, so it is context you maintain and never pay for — and a reader of the tree cannot tell it from live configuration. Three remedies: open a channel (give the `paths` globs a file they match, give the `description` trigger words), import it from a member that is reachable, or delete it. Advisory because a dead edge is a legitimate work-in-progress state; dial it or re-declare the clause `required` once your tree should hold the line."
cite = "https://code.claude.com/docs/en/memory#path-specific-rules (retrieved 2026-07-15); https://code.claude.com/docs/en/skills (retrieved 2026-07-16)"

[[declaration.clause]]
label = "root.fresh"
predicate = "fresh"
severity = "advisory"
guidance = "A lock row this member owns no longer matches disk: either its committed projection was hand-edited, or a fingerprinted source dependency it imports or includes has moved. Nothing reverse-parses a projection back into the program, so the two sides stay apart until you reconcile them: edit the owning source and re-emit, and for a moved dependency re-verify the member's claims against the new bytes first. Advisory because a drifted checkout is usually one `emit` away and blocking every such run would be temper's escalation, not yours; dial this label to `required` — or re-declare the clause — once a drifted projection should fail CI."

[[declaration.clause]]
label = "root.locus-declared"
predicate = "locus-declared"
severity = "advisory"
guidance = "A document sits at a governed locus that your program declares no member for. Claude Code loads it, but temper maintains nothing about it: `emit` never writes or reaps it, `guard` never bound it, and every address under it resolves to nothing — so it reads as governed configuration while being governed by no one. Declare the member in the program and re-emit; for a directory whose documents are authored in place rather than projected, declare its kind `local` so `check` derives the rows at read time instead. Advisory because a tree mid-adoption legitimately carries documents the program has not reached yet; dial this label to `required` — or re-declare the clause — once every document at a governed locus should be one you declared."

